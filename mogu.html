<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Shibam 💗</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(#101a3b, #29445b);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Georgia, serif;
}

.scene {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

.moon {
    position: absolute;
    top: 9%;
    right: 12%;
    width: 75px;
    height: 75px;
    border-radius: 50%;
    background: #fff0b5;
    box-shadow: 0 0 35px #fff0b5;
}

.flower {
    position: absolute;
    bottom: 22%;
    left: 50%;
    transform: translateX(-50%);
    width: 180px;
    height: 300px;
}

.stem {
    position: absolute;
    bottom: 0;
    left: 87px;
    width: 7px;
    height: 0;
    background: #65bd72;
    border-radius: 10px;
    animation: grow 2s ease-out 1s forwards;
}

@keyframes grow {
    to {
        height: 175px;
    }
}

.leaf {
    position: absolute;
    width: 65px;
    height: 30px;
    background: #79c878;
    opacity: 0;
}

.leaf.left {
    bottom: 85px;
    left: 28px;
    border-radius: 0 100% 0 100%;
    transform: rotate(15deg);
    animation: leafAppear 1s 2.5s forwards;
}

.leaf.right {
    bottom: 125px;
    right: 20px;
    border-radius: 100% 0 100% 0;
    transform: rotate(-15deg);
    animation: leafAppear 1s 2.8s forwards;
}

@keyframes leafAppear {
    to {
        opacity: 1;
    }
}

.flower-head {
    position: absolute;
    left: 48px;
    bottom: 158px;
    width: 85px;
    height: 85px;
    animation: flowerAppear 1s 3.5s backwards;
}

@keyframes flowerAppear {
    from {
        transform: scale(0);
    }
    to {
        transform: scale(1);
    }
}

.petal {
    position: absolute;
    width: 42px;
    height: 58px;
    left: 22px;
    top: -5px;
    border-radius: 50%;
    background: linear-gradient(#ffb4d0, #ff5f9e);
    transform-origin: 50% 47px;
    transform: rotate(var(--angle)) scale(0);
    animation: bloom 1.5s ease-out 4s forwards;
}

.petal:nth-child(1) { --angle: 0deg; }
.petal:nth-child(2) { --angle: 60deg; }
.petal:nth-child(3) { --angle: 120deg; }
.petal:nth-child(4) { --angle: 180deg; }
.petal:nth-child(5) { --angle: 240deg; }
.petal:nth-child(6) { --angle: 300deg; }

@keyframes bloom {
    to {
        transform: rotate(var(--angle)) scale(1);
    }
}

.center {
    position: absolute;
    width: 28px;
    height: 28px;
    background: #ffd85e;
    border-radius: 50%;
    top: 22px;
    left: 29px;
    opacity: 0;
    animation: showCenter 1s 5.5s forwards;
}

@keyframes showCenter {
    to {
        opacity: 1;
    }
}

.message {
    position: absolute;
    bottom: 8%;
    width: 100%;
    text-align: center;
    color: #ffc4dc;
    padding: 15px;
    opacity: 0;
    animation: messageAppear 2s 6s forwards;
}

.message h1 {
    font-size: 27px;
    text-shadow: 0 0 15px #ff72ad;
}

.message p {
    margin-top: 12px;
    font-size: 16px;
    color: #fff0f5;
}

@keyframes messageAppear {
    to {
        opacity: 1;
    }
}

.heart {
    position: absolute;
    bottom: -30px;
    color: #ff9fc7;
    animation: float 6s linear infinite;
}

@keyframes float {
    to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

</style>
</head>

<body>

<div class="scene">

    <div class="moon"></div>

    <div class="flower">

        <div class="stem"></div>

        <div class="leaf left"></div>
        <div class="leaf right"></div>

        <div class="flower-head">
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="center"></div>
        </div>

    </div>

    <div class="message">
        <h1>I LOVE YOUUU, SHIBAM! 💗</h1>
        <p>Just like this flower, my love keeps blooming. 🌷</p>
    </div>

</div>

<script>
function createHeart() {
    const heart = document.createElement("div");

    heart.className = "heart";
    heart.innerHTML = "♥";

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (12 + Math.random() * 18) + "px";
    heart.style.animationDuration = (4 + Math.random() * 4) + "s";

    document.querySelector(".scene").appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 8000);
}

setInterval(createHeart, 500);
</script>

</body>
</html>
